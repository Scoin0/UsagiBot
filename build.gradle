plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.2'
}

group = 'scoin0'
description = "UsagiBot"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

dependencies {

    implementation 'org.slf4j:slf4j-api:2.0.20'
    implementation 'ch.qos.logback:logback-classic:1.6.4'
    implementation 'org.jline:jansi:4.4.6'

    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.json:json:20260814'

    implementation 'com.github.twitch4j:twitch4j:1.27.0'
    implementation 'com.github.philippheuer.events4j:events4j-handler-reactor:0.12.3'

    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

}


/**
 * Tasks
 */

tasks.named('shadowJar') {
    archiveBaseName = 'UsagiBot'
    archiveClassifier = ''
    mergeServiceFiles()
    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Main-Class' : "usagibot.UsagiBot"
        )
    }
}

tasks.named('build') { dependsOn tasks.named('shadowJar')}

def stageDir = layout.buildDirectory.dir('jpackage-input')
def distDir = layout.buildDirectory.dir('dist')

tasks.register('stateForPackaging', Sync) {
    from tasks.named('shadowJar')
    into stageDir
}

tasks.register('packageApp', Exec) {
    dependsOn 'stageForPackaging'
    doFirst {
        delete distDir
        def jdk = javaToolchains.launcherFor(java.toolchain).get().metadata.installationPath
        def numericVersion = project.version.toString().replaceAll(/[^0-9.].*$/, '')
        def cmd = [
                "${jdk}/bin/jpackage",
                '--type', 'app-image',
                '--input', stageDir.get().asFile.path,
                '--dest', distDir.get().asFile.path,
                '--name', 'UsagiBot',
                '--app-version', numericVersion,
                '--main-jar', tasks.named('shadowJar').get().archiveFileName.get()
        ]
        if (System.getProperty('os.name').toLowerCase().contains('win')) cmd << '--win-console'
        commandLine cmd
    }
}